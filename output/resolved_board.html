<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Campus Customs resolved board</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font: 16px/1.45 Georgia, "Iowan Old Style", serif;
      color: #1c2b4a;
      background: #f6efe4;
    }
    main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-weight: normal; font-size: 32px; margin: 0 0 8px; }
    p { margin: 0 0 28px; }
    h2 { font-weight: normal; font-size: 22px; margin: 28px 0 10px; }
    img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(72, 46, 22, 0.12);
    }
  </style>
</head>
<body>
  <main>
    <h1>Resolved board</h1>
    <p>Checking finished at $160.00. Each picture is the React desk with that ticket selected.</p>
    <h2>101 · Bulldog tee</h2>
    <img src="board-101.png" alt="React desk with ticket 101 resolved">
    <h2>102 · Rent due</h2>
    <img src="board-102.png" alt="React desk with ticket 102 resolved">
    <h2>103 · Bulk hoodie discount</h2>
    <img src="board-103.png" alt="React desk with ticket 103 resolved">
  </main>
</body>
</html>
